<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تأكيد الحضور</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body { font-family: Arial; text-align:center; padding:50px; }
input, button { padding:10px; font-size:16px; margin:5px; }
#qrcode { margin-top:20px; }
#message { font-weight:bold; margin-top:10px; color:green; }
</style>
</head>
<body>

<h2>أدخل اسمك لتأكيد الحضور</h2>
<input type="text" id="guestName" placeholder="اكتب اسمك هنا">
<button onclick="showQRCode()">اعرض باركودي</button>

<div id="qrcode"></div>
<p id="message"></p>

<script>
function showQRCode() {
  const name = document.getElementById('guestName').value.trim();
  const qrcodeDiv = document.getElementById('qrcode');
  const msg = document.getElementById('message');
  qrcodeDiv.innerHTML = '';
  msg.textContent = '';

  if (!name) {
    msg.textContent = "الرجاء إدخال اسمك 😅";
    return;
  }

  google.script.run.withSuccessHandler(function(result) {
    if(result) {
      new QRCode(qrcodeDiv, { text: result.id, width:200, height:200 });
      msg.textContent = result.message;
    } else {
      msg.textContent = "❌ لم نجد اسمك في القائمة";
      msg.style.color = "red";
    }
  }).getGuestID(name);
}
</script>

</body>
</html>

</script>

</body>
</html>
