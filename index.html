<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تأكيد الحضور</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: Arial; text-align: center; padding: 50px; }
  input { padding: 10px; font-size: 16px; width: 250px; }
  button { padding: 10px 20px; font-size: 16px; margin-left: 10px; cursor: pointer; }
  #qrcode { margin-top: 20px; display: inline-block; }
  #message { color:red; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>

<h2>أدخل اسمك لتأكيد الحضور</h2>
<input type="text" id="guestName" placeholder="اكتب اسمك هنا">
<button onclick="showQRCode()">اعرض باركودي</button>

<div id="qrcode"></div>
<p id="message"></p>

<script>
const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqPXyYMLyCPRt9ZeJkq-_MinmZxrpDAzewB1XSq6fEoeICcagW6VYR7BKhIGuoXR9FAnfRgJ-6C_gJ/pub?output=csv";
let guests = {};

// جلب البيانات من Google Sheet
fetch(sheetCSVUrl)
  .then(response => response.text())
  .then(csvText => {
    const lines = csvText.trim().split("\n");
    lines.forEach(line => {
      const [name, id] = line.split(",");
      guests[name.trim()] = id.trim();
    });
  })
  .catch(err => {
    console.error("خطأ في جلب البيانات من الشيت:", err);
  });

// عرض QR Code
function showQRCode() {
  const name = document.getElementById("guestName").value.trim();
  const qrcodeDiv = document.getElementById("qrcode");
  const msg = document.getElementById("message");
  qrcodeDiv.innerHTML = "";
  msg.textContent = "";

  if (!name) {
    msg.textContent = "الرجاء إدخال اسمك 😅";
    return;
  }

  if (guests[name]) {
    new QRCode(qrcodeDiv, {
      text: guests[name],
      width: 200,
      height: 200
    });
  } else {
    msg.textContent = "ما لقيت اسمك 😅";
  }
}
</script>

</body>
</html>
